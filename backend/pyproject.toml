# Lint contract for the backend. Pinned here so tool updates cannot silently
# change the rule set (the unpinned ruff>=0.12,<1 already drifted its defaults
# once: 0.16 started flagging RUF/C408/FURB rules nobody asked for).
[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["**/migrations/*"]  # generated code, never hand-edited

[tool.ruff.lint]
# Errors, runtime bugs (F), import hygiene (I), likely bugs (B), pyupgrade (UP).
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
