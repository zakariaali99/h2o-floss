<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="H2O Floss — جهاز تنظيف الأسنان بالماء. 5 أوضاع، مقاوم للماء IPX7، ضمان سنتين وتوصيل مجاني لجميع أنحاء ليبيا." />
    <meta name="theme-color" content="#0c4a6e" />
    <title>H2O Floss — نظافة أسنان متكاملة</title>
    <script>
      // Applied before first paint so dark mode never flashes white.
      (function () {
        try {
          var t = localStorage.getItem('h2o-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* private mode */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
